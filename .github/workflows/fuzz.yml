name: Fuzz

# Throws millions of malformed archives at vaqum's readers each week. A
# crash or an extraction outside the output folder fails the run and
# uploads the input that caused it. Run locally with
#   cd fuzz && cargo +nightly fuzz run <archive|tar_extract|names>

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Seconds per target'
        default: '600'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [archive, tar_extract, names, secrets_file]
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz ${{ matrix.target }}
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '600' }}
        run: |
          mkdir -p corpus/${{ matrix.target }}
          cp seeds/${{ matrix.target }}/* corpus/${{ matrix.target }}/
          cargo fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} -- \
            -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048
      - name: Upload crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/
