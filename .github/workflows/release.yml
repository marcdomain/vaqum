name: Release

# Push a vX.Y.Z tag to build + publish everything. Or run manually from the
# Actions tab to pick platforms and publish targets individually.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build/publish, e.g. 0.1.0 (required — must match Cargo.toml)'
        required: true
        type: string
      platforms:
        description: 'Comma-separated targets to build, or "all"'
        required: false
        default: 'all'
        type: string
      publish_github_release:
        description: 'Create/update the GitHub Release'
        type: boolean
        default: true
      publish_npm:
        description: 'Publish to npm'
        type: boolean
        default: false
      publish_homebrew:
        description: 'Push to the Homebrew tap (also needs HOMEBREW_TAP_TOKEN set)'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-branch:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main branch
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "Error: tags must only be pushed on commits that exist on the main branch."
            exit 1
          fi

      - name: Resolve version
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify Cargo.toml version matches
        run: |
          set -euo pipefail
          PKG_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$PKG_VERSION" != "${{ steps.resolve.outputs.version }}" ]; then
            echo "Version mismatch: Cargo.toml=$PKG_VERSION, requested=${{ steps.resolve.outputs.version }}"
            exit 1
          fi

  test:
    needs: verify-branch
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --verbose

  # Resolves the build matrix + publish toggles from either trigger type.
  plan:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
      do_github_release: ${{ steps.compute.outputs.do_github_release }}
      do_npm: ${{ steps.compute.outputs.do_npm }}
      do_homebrew: ${{ steps.compute.outputs.do_homebrew }}
    steps:
      - id: compute
        shell: bash
        run: |
          set -euo pipefail
          declare -A ALL_TARGETS=(
            [x86_64-apple-darwin]=macos-latest
            [aarch64-apple-darwin]=macos-latest
            [x86_64-unknown-linux-gnu]=ubuntu-latest
            [aarch64-unknown-linux-musl]=ubuntu-latest
            [x86_64-pc-windows-msvc]=windows-latest
          )
          # Targets that don't run natively on their runner's arch need
          # cross-rs/cross (Docker-based) instead of plain `cargo build`.
          declare -A CROSS_TARGETS=(
            [aarch64-unknown-linux-musl]=1
          )

          if [ "${{ github.event_name }}" = "push" ]; then
            PLATFORMS="all"
            DO_GH="true"
            DO_NPM="true"
            DO_BREW="true"
          else
            PLATFORMS="${{ inputs.platforms }}"
            DO_GH="${{ inputs.publish_github_release }}"
            DO_NPM="${{ inputs.publish_npm }}"
            DO_BREW="${{ inputs.publish_homebrew }}"
          fi

          if [ -z "$PLATFORMS" ] || [ "$PLATFORMS" = "all" ]; then
            SELECTED=("${!ALL_TARGETS[@]}")
          else
            IFS=',' read -ra SELECTED <<< "$PLATFORMS"
          fi

          matrix_json="["
          first=true
          for raw in "${SELECTED[@]}"; do
            t="$(echo "$raw" | xargs)"
            os="${ALL_TARGETS[$t]:-}"
            if [ -z "$os" ]; then
              echo "::error::unknown target '$t'. Valid targets: ${!ALL_TARGETS[*]}"
              exit 1
            fi
            use_cross="false"
            [ -n "${CROSS_TARGETS[$t]:-}" ] && use_cross="true"
            [ "$first" = true ] || matrix_json+=","
            matrix_json+="{\"target\":\"$t\",\"os\":\"$os\",\"use_cross\":$use_cross}"
            first=false
          done
          matrix_json+="]"

          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"
          echo "do_github_release=$DO_GH" >> "$GITHUB_OUTPUT"
          echo "do_npm=$DO_NPM" >> "$GITHUB_OUTPUT"
          echo "do_homebrew=$DO_BREW" >> "$GITHUB_OUTPUT"

  build:
    needs: [verify-branch, plan]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package release assets
        shell: bash
        env:
          VERSION: ${{ needs.verify-branch.outputs.version }}
        run: |
          set -euo pipefail
          sha256() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1"; else shasum -a 256 "$1"; fi
          }

          target="${{ matrix.target }}"
          ext=""
          case "$target" in *windows*) ext=".exe" ;; esac
          bin="target/${target}/release/vaqum${ext}"

          # Bare binary: what npm's postinstall fetches directly.
          bare="vaqum-${VERSION}-${target}${ext}"
          cp "$bin" "$bare"
          chmod +x "$bare" || true
          sha256 "$bare" > "${bare}.sha256"

          # Tarball: for Homebrew and install.sh.
          stage="$(mktemp -d)/vaqum-${VERSION}-${target}"
          mkdir -p "$stage"
          cp "$bin" README.md LICENSE "$stage"/
          archive="vaqum-${VERSION}-${target}.tar.gz"
          tar -czf "$archive" -C "$stage" .
          sha256 "$archive" > "${archive}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: vaqum-${{ matrix.target }}
          path: |
            vaqum-*
            !vaqum-*.tar.gz.tmp
          if-no-files-found: error

  github-release:
    needs: [verify-branch, plan, build]
    if: needs.plan.outputs.do_github_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.verify-branch.outputs.version }}
          files: dist/*
          generate_release_notes: true

  npm-publish:
    needs: [verify-branch, plan, github-release]
    if: needs.plan.outputs.do_npm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify npm package version matches
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${{ needs.verify-branch.outputs.version }}" ]; then
            echo "Version mismatch: npm/package.json=$PKG_VERSION, requested=${{ needs.verify-branch.outputs.version }}"
            exit 1
          fi

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  check-homebrew-secret:
    needs: [plan, github-release]
    if: needs.plan.outputs.do_homebrew == 'true'
    runs-on: ubuntu-latest
    outputs:
      has-token: ${{ steps.check.outputs.has-token }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "has-token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-token=false" >> "$GITHUB_OUTPUT"
          fi

  homebrew-tap:
    needs: [verify-branch, plan, github-release, check-homebrew-secret]
    runs-on: ubuntu-latest
    # See packaging/homebrew/README.md for the tap's one-time setup.
    if: needs.plan.outputs.do_homebrew == 'true' && needs.check-homebrew-secret.outputs.has-token == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Render formula
        env:
          VERSION: ${{ needs.verify-branch.outputs.version }}
        run: |
          set -euo pipefail
          sha_arm="$(cut -d' ' -f1 "dist/vaqum-${VERSION}-aarch64-apple-darwin.tar.gz.sha256")"
          sha_intel="$(cut -d' ' -f1 "dist/vaqum-${VERSION}-x86_64-apple-darwin.tar.gz.sha256")"
          sha_linux="$(cut -d' ' -f1 "dist/vaqum-${VERSION}-x86_64-unknown-linux-gnu.tar.gz.sha256")"
          ./packaging/homebrew/render.sh "$VERSION" "$sha_intel" "$sha_arm" "$sha_linux" > vaqum.rb

      - name: Push to homebrew-vaqum tap
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/marcdomain/homebrew-vaqum.git" tap
          mkdir -p tap/Formula
          cp vaqum.rb tap/Formula/vaqum.rb
          cd tap
          git config user.name "vaqum-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Formula/vaqum.rb
          git diff --cached --quiet && exit 0
          git commit -m "vaqum v${{ needs.verify-branch.outputs.version }}"
          git push
