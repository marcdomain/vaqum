name: Viewer site

# Builds the browser viewer (web/) and publishes it on GitHub Pages.
# One-time setup: Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/format.rs'
      - 'src/risk.rs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the viewer
        run: |
          cd web
          cargo build --target wasm32-unknown-unknown --release --locked
          cp target/wasm32-unknown-unknown/release/vaqum_viewer.wasm site/vaqum-viewer.wasm
      - name: Test it against archives from the real CLI
        run: |
          cargo build --locked
          VAQUM_BIN=target/debug/vaqum node --test web/test/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
