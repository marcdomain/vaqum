[package]
name = "vaqum"
version = "1.3.2"
edition = "2024"
description = "Losslessly compress, decompress, and securely shred files from the command line."
license = "MIT"
repository = "https://github.com/marcdomain/vaqum"
readme = "README.md"
keywords = ["compression", "zstd", "lzma", "shred", "cli"]
categories = ["command-line-utilities", "compression"]

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
chacha20poly1305 = { version = "0.10.1", features = ["stream"] }
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
ct-codecs = "1.1.8"
ctrlc = "3.5.3"
flate2 = "1.1.10"
fs2 = "0.4.3"
globset = "0.4.20"
hkdf = "0.13.0"
hmac = "0.13.0"
humansize = "2.1.3"
indicatif = "0.18.6"
minisign = "0.10.0"
rand = "0.10.2"
rayon = "1.12.0"
regex = "1.13.1"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "3.2.0"
tar = "0.4.46"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["formatting"] }
toml = "1.1.4"
walkdir = "2.5.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
xz2 = { version = "0.1.7", features = ["static"] }
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }
zstd = { version = "0.14.4", features = ["zstdmt"] }
zxcvbn = "3.1.1"

# Single-binary distribution (see project brief) favors a smaller, faster
# release build over fast incremental compiles.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

# Terminal tests: drive a pseudo-terminal to type passwords like a user
# (same nix version ctrlc already pulls in).
[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.32", features = ["term", "process", "signal"] }

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.52"

[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1.7.0"

[target."cfg(windows)".dev-dependencies]
portable-pty = "0.9.0"

# Key derivation is deliberately expensive; optimize it even in debug
# builds so `cargo test` (which encrypts archives) stays fast.
[profile.dev.package.argon2]
opt-level = 3
