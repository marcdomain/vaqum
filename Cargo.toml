[package]
name = "vaqum"
version = "0.1.0"
edition = "2024"
description = "Losslessly compress, decompress, and securely shred files from the command line."
license = "MIT"
repository = "https://github.com/marcdomain/vaqum"
readme = "README.md"
keywords = ["compression", "zstd", "lzma", "shred", "cli"]
categories = ["command-line-utilities", "compression"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
humansize = "2.1.3"
rand = "0.10.2"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "3.2.0"
tar = "0.4.46"
tempfile = "3.27.0"
walkdir = "2.5.0"
xz2 = { version = "0.1.7", features = ["static"] }
zstd = { version = "0.13.3", features = ["zstdmt"] }

# Single-binary distribution (see project brief) favors a smaller, faster
# release build over fast incremental compiles.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
