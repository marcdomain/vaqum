[package]
name = "vaqum-viewer"
version = "0.1.0"
edition = "2024"
publish = false
description = "Opens .vqm archives in the browser (WebAssembly). See web/README.md."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = { version = "0.4.46", default-features = false }
ruzstd = "0.9.1"
lzma-rs = "0.3"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc", "stream"] }
miniz_oxide = "0.8"
crc32fast = "1"

# Kept out of the main crate's build.
[workspace]
members = ["."]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
